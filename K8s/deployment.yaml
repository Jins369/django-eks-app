
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-web
  labels:
    app: django-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-web
  template:
    metadata:
      labels:
        app: django-web
    spec:
      containers:
        - name: django
          image: 572114433256.dkr.ecr.ap-south-1.amazonaws.com/django-eks-app:latest
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              value: "replace-with-a-strong-random-secret-key"
            - name: DEBUG
              value: "False"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15